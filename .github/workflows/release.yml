name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      target_sha: ${{ steps.ver.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release tag
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $versionMatch = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"'
          if (-not $versionMatch) { throw "Could not read package version from Cargo.toml." }
          $v = $versionMatch.Matches[0].Groups[1].Value
          $tag = "v$v"
          $targetSha = $env:RELEASE_SHA
          $existingTag = git tag -l $tag
          if ($LASTEXITCODE -ne 0) { throw "Could not check for existing release tag." }

          if ($existingTag) {
            $tagCommit = (git rev-parse "${tag}^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
              throw "Could not resolve existing tag $tag to a commit."
            }
            git merge-base --is-ancestor $tagCommit origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Existing release tag $tag must point to a commit reachable from main."
            }
            $tagCargo = git show "${tagCommit}:Cargo.toml"
            if ($LASTEXITCODE -ne 0) { throw "Could not read Cargo.toml from tag $tag." }
            $tagVersionMatch = $tagCargo | Select-String -Pattern '^version = "([^"]+)"'
            if (-not $tagVersionMatch -or $tagVersionMatch.Matches[0].Groups[1].Value -ne $v) {
              throw "Existing tag $tag does not point to a commit with version $v."
            }
            $targetSha = $tagCommit

            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $release = $null
            try {
              $release = Invoke-RestMethod `
                -Method Get `
                -Uri "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$tag" `
                -Headers $headers
            } catch {
              $response = $_.Exception.Response
              $statusCode = if ($null -ne $response) { [int]$response.StatusCode } else { 0 }
              if ($statusCode -ne 404) { throw }
            }

            if ($null -ne $release -and -not $release.draft) {
              $expectedAssets = @("FileManager-$tag-x64.zip", "manifest.json", "SHA256SUMS.txt")
              $existingAssets = @($release.assets | ForEach-Object { $_.name })
              $missingAssets = @($expectedAssets | Where-Object { $existingAssets -notcontains $_ })
              if ($missingAssets.Count -eq 0) {
                Write-Output "Release $tag is already published with all assets - nothing to do."
                exit 0
              }
              Write-Output "Release $tag is incomplete; retrying missing assets: $($missingAssets -join ', ')"
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "target_sha=$targetSha" >> $env:GITHUB_OUTPUT

  build-release:
    needs: resolve-release
    if: needs.resolve-release.outputs.tag != ''
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Tests gate the release: a red suite blocks tag creation and publish.
      - name: Test
        run: cargo test --locked

      - name: Prepare signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "Set the WINDOWS_SIGNING_PFX_BASE64 GitHub Actions secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "Set the WINDOWS_SIGNING_PFX_PASSWORD GitHub Actions secret."
          }

          $pfxBytes = [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxBytes,
            $env:SIGNING_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          if (-not $certificate.HasPrivateKey) {
            throw "The PFX does not contain a signing certificate with a private key."
          }
          $certificateHash = $certificate.GetCertHashString(
            [System.Security.Cryptography.HashAlgorithmName]::SHA256
          )
          $fingerprint = $certificateHash.Replace(" ", "").ToUpperInvariant()
          if ($fingerprint -notmatch '^[0-9A-F]{64}$') {
            throw "The signing certificate has an invalid SHA-256 fingerprint."
          }
          $certificate.Dispose()
          "FILEMANAGER_SIGNER_SHA256=$fingerprint" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --bins --locked

      - name: Sign executables
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "Set the WINDOWS_SIGNING_PFX_BASE64 GitHub Actions secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "Set the WINDOWS_SIGNING_PFX_PASSWORD GitHub Actions secret."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "filemanager-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          )

          $sdkRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path (Join-Path $sdkRoot "*\x64\signtool.exe") |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw "Windows SDK signtool.exe was not found."
          }

          foreach ($exe in @("target\release\filemanager.exe", "target\release\FileManagerUpdater.exe")) {
            & $signtool.FullName sign /f $pfxPath /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v $exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $exe." }
          }

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "filemanager-signing.pfx"
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force
          }

      - name: Verify signed executables
        shell: pwsh
        run: |
          $verifier = (Resolve-Path -LiteralPath "target\release\FileManagerUpdater.exe").Path
          foreach ($relativeExe in @("target\release\filemanager.exe", "target\release\FileManagerUpdater.exe")) {
            $exe = (Resolve-Path -LiteralPath $relativeExe).Path
            $verifyOutput = & $verifier --verify-file $exe 2>&1
            $verifyExitCode = $LASTEXITCODE
            if ($verifyExitCode -ne 0) {
              if ($verifyOutput) {
                Write-Host ($verifyOutput | Out-String)
              }
              $signature = Get-AuthenticodeSignature -LiteralPath $exe
              $actualFingerprint = "<none>"
              if ($null -ne $signature.SignerCertificate) {
                $actualFingerprint = $signature.SignerCertificate.GetCertHashString(
                  [System.Security.Cryptography.HashAlgorithmName]::SHA256
                ).ToUpperInvariant()
              }
              throw "Pinned Authenticode verification failed for $exe (status: $($signature.Status); details: $($signature.StatusMessage); expected SHA-256: $env:FILEMANAGER_SIGNER_SHA256; actual: $actualFingerprint)."
            }
          }

      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          $archiveName = "FileManager-$tag-x64.zip"
          $package = Join-Path $env:RUNNER_TEMP "filemanager-update-package"
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force $package | Out-Null

          Copy-Item target\release\filemanager.exe (Join-Path $package "FileManager.exe")
          Copy-Item target\release\FileManagerUpdater.exe (Join-Path $package "FileManagerUpdater.exe")

          $dist = (Resolve-Path "dist").Path
          # Record each executable's hash before adding it to the update archive.
          $appSha256 = (Get-FileHash -Path (Join-Path $package "FileManager.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $updaterSha256 = (Get-FileHash -Path (Join-Path $package "FileManagerUpdater.exe") -Algorithm SHA256).Hash.ToLowerInvariant()

          $archivePath = Join-Path $dist $archiveName
          $packageFiles = Get-ChildItem -Path $package -File | Select-Object -ExpandProperty FullName
          Compress-Archive -Path $packageFiles -DestinationPath $archivePath -CompressionLevel Optimal

          $archiveSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -Path $archivePath).Length
          $checksums = @(
            "$appSha256  FileManager.exe"
            "$updaterSha256  FileManagerUpdater.exe"
            "$archiveSha256  $archiveName"
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $dist "SHA256SUMS.txt"),
            $checksums,
            [System.Text.Encoding]::ASCII
          )

          $manifest = [ordered]@{
            schema_version = 1
            version = $version
            archive_url = "https://github.com/${{ github.repository }}/releases/download/$tag/$archiveName"
            sha256 = $archiveSha256
            size = $size
          }
          $json = $manifest | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText(
            (Join-Path $dist "manifest.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build changelog from commit messages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $tag = $env:RELEASE_TAG
          $tags = git tag -l "v*" | Sort-Object { [version]($_.TrimStart('v')) }
          $prev = ($tags | Where-Object { $_ -lt $tag } | Select-Object -Last 1)
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          # Only commits that touch the program itself (not CI/docs/infra),
          # and not test-only commits.
          $shas = git log $range --pretty=format:"%H" -- src i18n resources build.rs app.manifest app.rc Cargo.toml
          $out = foreach ($s in $shas) {
            $subj = git log -1 --pretty=format:"%s" $s
            if ($subj -match 'тест') { continue }
            "### $subj"
            ""
            git log -1 --pretty=format:"%b" $s | Where-Object { $_ -notmatch "Generated with|Co-Authored-By" }
            ""
          }
          $out | Out-File -Encoding utf8 CHANGELOG_REL.md

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/
            CHANGELOG_REL.md
          if-no-files-found: error

  publish-release:
    needs: [resolve-release, build-release]
    if: needs.resolve-release.outputs.tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Create and push tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          TARGET_SHA: ${{ needs.resolve-release.outputs.target_sha }}
        run: |
          $tag = $env:RELEASE_TAG
          $existingTag = git tag -l $tag
          if ($LASTEXITCODE -ne 0) { throw "Could not check for existing release tag." }
          if ($existingTag) {
            $tagCommit = (git rev-parse "${tag}^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:TARGET_SHA) {
              throw "Existing release tag $tag points to a different commit."
            }
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag $env:TARGET_SHA
          $auth = [Convert]::ToBase64String(
            [System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin $tag
          if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag." }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          target_commitish: ${{ needs.resolve-release.outputs.target_sha }}
          files: dist/*
          body_path: CHANGELOG_REL.md
          overwrite_files: true
