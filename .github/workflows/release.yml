name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\filemanager.exe "dist\FileManager-${{ github.ref_name }}-x64.exe"

      - name: Build changelog from commit messages
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 HEAD~1 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          git log $range --pretty=format:"### %s%n%n%b" |
            Where-Object { $_ -notmatch "Generated with|Co-Authored-By" } |
            Out-File -Encoding utf8 CHANGELOG_REL.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: CHANGELOG_REL.md
