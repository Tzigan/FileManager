name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Resolve the release tag. On a tag push — use it. On a push to main —
      # read the version from Cargo.toml; if its tag doesn't exist yet,
      # create and push it (GITHUB_TOKEN pushes don't retrigger workflows).
      - name: Resolve release tag
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$v"
          if (git tag -l $tag) {
            Write-Output "Tag $tag already released — nothing to do."
            exit 0
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        if: steps.ver.outputs.tag != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.ver.outputs.tag != ''
        uses: Swatinem/rust-cache@v2

      # Tests gate the release: a red suite blocks tag creation and publish.
      - name: Test
        if: steps.ver.outputs.tag != ''
        run: cargo test --locked

      - name: Build
        if: steps.ver.outputs.tag != ''
        run: cargo build --release --bins --locked

      - name: Package
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = $tag.TrimStart('v')
          $archiveName = "FileManager-$tag-x64.zip"
          $package = Join-Path $env:RUNNER_TEMP "filemanager-update-package"
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force $package | Out-Null

          # Keep the legacy exe asset so 0.6.x clients can migrate to the updater release.
          Copy-Item target\release\filemanager.exe "dist\FileManager-$tag-x64.exe"
          Copy-Item target\release\filemanager.exe (Join-Path $package "FileManager.exe")
          Copy-Item target\release\FileManagerUpdater.exe (Join-Path $package "FileManagerUpdater.exe")

          $dist = (Resolve-Path "dist").Path
          $archivePath = Join-Path $dist $archiveName
          $packageFiles = Get-ChildItem -Path $package -File | Select-Object -ExpandProperty FullName
          Compress-Archive -Path $packageFiles -DestinationPath $archivePath -CompressionLevel Optimal

          $sha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -Path $archivePath).Length
          $manifest = [ordered]@{
            schema_version = 1
            version = $version
            archive_url = "https://github.com/${{ github.repository }}/releases/download/$tag/$archiveName"
            sha256 = $sha256
            size = $size
          }
          $json = $manifest | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText(
            (Join-Path $dist "manifest.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

      # The tag is created only after a successful build, so a failed run
      # never leaves a tag that would block re-publishing.
      - name: Create and push tag
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          if (git tag -l $tag) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag

      - name: Build changelog from commit messages
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $tags = git tag -l "v*" | Sort-Object { [version]($_.TrimStart('v')) }
          $prev = ($tags | Where-Object { $_ -lt "${{ steps.ver.outputs.tag }}" } | Select-Object -Last 1)
          $range = if ($prev) { "$prev..${{ steps.ver.outputs.tag }}" } else { "HEAD" }
          # Only commits that touch the program itself (not CI/docs/infra),
          # and not test-only commits.
          $shas = git log $range --pretty=format:"%H" -- src i18n resources build.rs app.manifest app.rc Cargo.toml
          $out = foreach ($s in $shas) {
            $subj = git log -1 --pretty=format:"%s" $s
            if ($subj -match 'тест') { continue }
            "### $subj"
            ""
            git log -1 --pretty=format:"%b" $s | Where-Object { $_ -notmatch "Generated with|Co-Authored-By" }
            ""
          }
          $out | Out-File -Encoding utf8 CHANGELOG_REL.md

      - name: Publish release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: dist/*
          body_path: CHANGELOG_REL.md
