[package]
name = "filemanager"
version = "0.4.0"
edition = "2024"
description = "Portable file manager for Windows 11 x64"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
