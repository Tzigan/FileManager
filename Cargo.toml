[package]
name = "filemanager"
version = "0.6.3"
edition = "2024"
description = "Portable file manager for Windows 11 x64"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
ureq = "3.5.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
